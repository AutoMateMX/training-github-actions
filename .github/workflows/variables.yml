name: Saludo usando variables
run-name: ¡Estoy aprendiendo a usar Variables!
on:
  workflow_dispatch
env:
  DIA_DE_SEMANA: Lunes
jobs:
  saludo-variables:
    runs-on: ubuntu-latest
    env:
      SALUDO: Quiubo
    steps:
      - name: Saludar
        run: echo "$SALUDO, $NOMBRE. Tu apellido es ${{ vars.APELLIDO }}"
        env:
          NOMBRE: Erick